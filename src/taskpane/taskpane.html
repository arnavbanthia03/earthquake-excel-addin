<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earthquake Data</title>

  <!-- Office.js: must load before taskpane.js -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>
  <header class="app-header">
    <h1>Earthquake Tracker</h1>
    <p class="subtitle">Live data from USGS (past month)</p>
  </header>

  <main class="app-main">
    <p class="description">
      Click the button below to pull the latest earthquakes into a worksheet named
      <strong>Earthquakes</strong>.
    </p>

    <button id="fetch-btn" class="btn-primary">Fetch Latest Earthquakes</button>
    <button id="clear-btn" class="btn-secondary">Clear Sheet</button>

    <div id="loader" class="loader hidden" role="status" aria-live="polite">
      <div class="spinner"></div>
      <span>Fetching data…</span>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </main>
</body>
</html>
